<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>404 - Page Not Found | Game Night Hub</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0d0e12">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0d0e12;
    background-image: 
      radial-gradient(circle at 50% 30%, rgba(10, 132, 255, 0.15) 0%, transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(255, 59, 48, 0.12) 0%, transparent 50%);
    color: #f5f5f7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  .card-404 {
    background: #17181e;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 28px;
    padding: 48px 32px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  }

  .icon-404 {
    font-size: 4.5rem;
    margin-bottom: 16px;
    display: inline-block;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 {
    font-size: 2.8rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .badge-404 {
    display: inline-block;
    padding: 4px 12px;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-radius: 999px;
    background: rgba(255, 69, 58, 0.15);
    color: #FF453A;
    border: 1px solid rgba(255, 69, 58, 0.3);
    margin-bottom: 16px;
  }

  p {
    color: #8e8e93;
    font-size: 1.05rem;
    line-height: 1.55;
    margin-bottom: 28px;
  }

  .countdown-text {
    font-size: 0.9rem;
    color: #636366;
    margin-bottom: 20px;
  }
  .countdown-text strong {
    color: #0A84FF;
  }

  .btn-hub {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px 24px;
    background: #0A84FF;
    color: white;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 700;
    border-radius: 16px;
    transition: background 0.2s, transform 0.15s;
    box-shadow: 0 8px 24px rgba(10, 132, 255, 0.35);
  }

  .btn-hub:hover {
    background: #0071e3;
    transform: translateY(-2px);
  }
</style>
</head>
<body>

<div class="card-404">
  <div class="icon-404">🛸</div>
  <div class="badge-404">Lost in Space</div>
  <h1>Room Not Found</h1>
  <p>The page or game link you entered doesn't exist or has moved. Let's get you back into the action!</p>
  <div class="countdown-text">Redirecting to Game Hub in <strong id="cd">5</strong> seconds...</div>
  <a href="index.html" class="btn-hub">← Return to Game Hub</a>
</div>

<script>
  let seconds = 5;
  const cdEl = document.getElementById("cd");
  const timer = setInterval(() => {
    seconds--;
    if (cdEl) cdEl.innerText = seconds;
    if (seconds <= 0) {
      clearInterval(timer);
      window.location.href = "index.html";
    }
  }, 1000);
</script>

</body>
</html>
